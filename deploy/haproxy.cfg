# Optional stable Outlook endpoint, placed beside the independent witness.
# Requires HAProxy with TLS 1.3 support. This host handles plaintext inside its TLS bridge.
# Restrict backend 465/993 to this gateway or approved client networks.
global
    maxconn 32
    ssl-default-bind-options ssl-min-ver TLSv1.2
    ssl-default-server-options ssl-min-ver TLSv1.3

defaults
    mode tcp
    timeout connect 5s
    timeout client 35m
    timeout server 35m

frontend imaps
    bind :993 ssl crt /etc/haproxy/mail.pem
    default_backend active_imap

backend active_imap
    option tcp-check
    tcp-check connect port 25
    tcp-check expect rstring ^220
    server node_a 10.20.0.11:993 ssl verify required ca-file /etc/haproxy/mail-ca.pem sni str(mail.example.com) check inter 2s fall 2 rise 1
    server node_b 10.20.0.12:993 ssl verify required ca-file /etc/haproxy/mail-ca.pem sni str(mail.example.com) check inter 2s fall 2 rise 1 backup

frontend submissions
    bind :465 ssl crt /etc/haproxy/mail.pem
    default_backend active_submission

backend active_submission
    option tcp-check
    tcp-check connect port 25
    tcp-check expect rstring ^220
    server node_a 10.20.0.11:465 ssl verify required ca-file /etc/haproxy/mail-ca.pem sni str(mail.example.com) check inter 2s fall 2 rise 1
    server node_b 10.20.0.12:465 ssl verify required ca-file /etc/haproxy/mail-ca.pem sni str(mail.example.com) check inter 2s fall 2 rise 1 backup

# Keep inbound port 25 DIRECT to the mail nodes so SPF sees the sending MTA's IP.
# Workglen Mail does not implement the HAProxy PROXY protocol.
